name: "Bot: Send Close Pull Request Signal"

# Stock Workbench workflows expect one lesson at the repository root.
# lessons/* are built by "01 Maintain: Build and Deploy Site".
on:
  workflow_dispatch:

jobs:
  send-close-signal:
    name: "Send closing signal"
    runs-on: ubuntu-22.04
    if: ${{ github.event.action == 'closed' }}
    steps:
      - name: "Create PRtifact"
        run: |
          mkdir -p ./pr
          printf ${{ github.event.number }} > ./pr/NUM
      - name: Upload Diff
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr
