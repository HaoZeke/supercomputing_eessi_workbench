name: "01 Maintain: Build and Deploy Site"
description: "Build every lesson and publish one site at supersurf.rgoswami.me"
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 2"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docker-build-deploy
  cancel-in-progress: true

jobs:
  assemble:
    name: "Build lessons and assemble the site"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/carpentries/workbench-docker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble
        run: bash tooling/assemble-site.sh

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: site/docs
          if-no-files-found: error

  deploy:
    name: "Publish the assembled site"
    needs: assemble
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: pages
          path: site/docs

      - name: Keep the custom domain in the artifact
        run: printf '%s\n' 'supersurf.rgoswami.me' > site/docs/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/docs
          cname: supersurf.rgoswami.me
          force_orphan: true
