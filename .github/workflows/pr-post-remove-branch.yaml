name: "Bot: Remove Temporary PR Branch"

# Stock Workbench workflows expect one lesson at the repository root.
# lessons/* are built by "01 Maintain: Build and Deploy Site".
on:
  workflow_dispatch:

jobs:
  delete:
    name: "Delete branch from Pull Request"
    runs-on: ubuntu-22.04
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - name: 'Download artifact'
        uses: carpentries/actions/download-workflow-artifact@main
        with:
          run: ${{ github.event.workflow_run.id }}
          name: pr
      - name: "Get PR Number"
        id: get-pr
        run: |
          unzip pr.zip
          echo "NUM=$(<./NUM)" >> $GITHUB_OUTPUT
      - name: 'Remove branch'
        uses: carpentries/actions/remove-branch@main
        with:
          pr: ${{ steps.get-pr.outputs.NUM }}
